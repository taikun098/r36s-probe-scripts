unbindall
bind TAB "+showscores"
bind ESCAPE "cancelselect"
bind ' "+moveup"
bind , "+moveleft"
bind - "sizedown"
bind . "+moveright"
bind / "+movedown"
bind 1 "slot1"
bind 2 "slot2"
bind 3 "slot3"
bind 4 "slot4"
bind 5 "slot5"
bind SEMICOLON "+mlook"
bind = "sizeup"
bind [ "invprev"
bind ` "toggleconsole"
bind f "impulse 100"
bind k "+voicerecord"
bind q "lastinv"
bind t "impulse 201"
bind u "messagemode2"
bind y "messagemode"
bind UPARROW "impulse 201"
bind DOWNARROW "lastinv"
bind LEFTARROW "invprev"
bind RIGHTARROW "invnext"
bind ALT "+strafe"
bind F1 "cmd help"
bind F2 "menu_savegame"
bind F3 "menu_loadgame"
bind F4 "menu_keys"
bind F5 "snapshot"
bind F8 "stop"
bind F10 "quit prompt"
bind F12 "screenshot"
bind INS "+klook"
bind PGDN "+lookdown"
bind PGUP "+lookup"
bind END "centerview"
bind A_BUTTON "+use"
bind B_BUTTON "screenshot"
bind X_BUTTON "cancelselect"
bind Y_BUTTON "+reload"
bind L1_BUTTON "load quick"
bind R1_BUTTON "save quick"
bind BACK "quit"
bind MODE "+SelectHold"
bind START "+speed"
bind STICK1 "+duck"
bind STICK2 "+speed"
bind L2_BUTTON "+attack2"
// end of keyboard.cfg
